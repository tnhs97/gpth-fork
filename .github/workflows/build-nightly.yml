name: Build nightly

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Get exe name
        id: exe_name
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            echo "name=gpth-linux" >> $GITHUB_OUTPUT
          elif [ "$RUNNER_OS" == "Windows" ]; then
            echo "name=gpth-windoza.exe" >> $GITHUB_OUTPUT
          elif [ "$RUNNER_OS" == "macOS" ]; then
            echo "name=gpth-macos" >> $GITHUB_OUTPUT
          else
            echo "Unknown OS: $RUNNER_OS"
            exit 69
          fi
      - name: Build exe
        shell: bash
        run: |
          cargo build --release --locked
          suffix=""
          if [ "$RUNNER_OS" == "Windows" ]; then suffix=".exe"; fi
          cp "target/release/gpth$suffix" "./${{ steps.exe_name.outputs.name }}"
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: gpth-nightly-${{ runner.os }}
          path: ./${{ steps.exe_name.outputs.name }}
          if-no-files-found: error
