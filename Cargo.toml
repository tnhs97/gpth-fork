[package]
name = "gpth"
version = "3.5.0"
edition = "2024"
rust-version = "1.89"
description = "Organize media exported from Google Photos"
license = "Apache-2.0"
repository = "https://github.com/TheLastGimbus/GooglePhotosTakeoutHelper"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dunce = "1"
infer = "0.19"
kamadak-exif = "0.6"
mime_guess = "2"
regex = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
unicode-normalization = "0.1"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell"] }
